<!DOCTYPE html>
<html>
<head>
    <title>AFTERHOURS</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<script>
    AFRAME.registerComponent('repeat-object', {

        schema: {
            template: { type: 'selector' },
            count: { type: 'int', default: 10 },
            spacing: { type: 'number', default: 10 },
            startZ: { type: 'number', default: 0 }
        },

        init: function () {

            const template = this.data.template;

            if (!template) {
                console.error('Repeat-object: Template not found!');
                return;
            }

            for (let i = 0; i < this.data.count; i++) {

                // Make a copy of the original object
                const clone = template.cloneNode(true);

                // Remove the original ID
                clone.removeAttribute('id');

                // Make the copy visible
                clone.setAttribute('visible', true);

                // Calculate its new position
                const zPosition =
                    this.data.startZ - (i * this.data.spacing);

                clone.setAttribute('position', {
                    x: 0,
                    y: 0,
                    z: zPosition
                });

                // Add the copy to the scene
                this.el.appendChild(clone);
            }
        }
    });
    
    // PROCEDURAL CITY BUILDINGS
    AFRAME.registerComponent('city-buildings', {

        schema: {
            side: { type: 'string', default: 'right' },
            count: { type: 'int', default: 18 },
            spacing: { type: 'number', default: 56 },
            startZ: { type: 'number', default: 470 }
        },

        init: function () {

            const side = this.data.side;

            // Different dark exterior colors
            const buildingColors = [
                '#151C29',
                '#202633',
                '#252A35',
                '#171D27',
                '#292D38'
            ];

            // Colors for illuminated windows
            const windowColors = [
                '#FFD58A',
                '#FFE6B0',
                '#A9D9FF',
                '#D5C9FF'
            ];

            // Generate buildings along the highway
            for (let i = 0; i < this.data.count; i++) {

                const building = document.createElement('a-entity');

                // Random building dimensions
                const width = 24 + Math.random() * 12;
                const height = 65 + Math.random() * 60;
                const depth = 38 + Math.random() * 10;

                // Place buildings below highway level
                const baseY = -35;
                const centerY = baseY + height / 2;

                // Position buildings on opposite sides
                let xPosition;

                if (side === 'right') {
                    xPosition = 51 + Math.random() * 8;
                } else {
                    xPosition = -84 - Math.random() * 8;
                }

                // Slight variation in distance along the highway
                const zPosition =
                    this.data.startZ -
                    (i * this.data.spacing) +
                    (Math.random() * 6 - 3);

                // Main building structure
                const structure = document.createElement('a-box');

                structure.setAttribute('width', width);
                structure.setAttribute('height', height);
                structure.setAttribute('depth', depth);

                structure.setAttribute('position', {
                    x: xPosition,
                    y: centerY,
                    z: zPosition
                });

                structure.setAttribute('material', {
                    color: buildingColors[
                        Math.floor(Math.random() * buildingColors.length)
                    ],
                    roughness: 0.85,
                    metalness: 0.2
                });

                building.appendChild(structure);

                // Small rooftop structure to add variation
                const rooftop = document.createElement('a-box');

                rooftop.setAttribute('width', width * 0.65);
                rooftop.setAttribute('height', 2);
                rooftop.setAttribute('depth', depth * 0.65);

                rooftop.setAttribute('position', {
                    x: xPosition,
                    y: baseY + height + 1,
                    z: zPosition
                });

                rooftop.setAttribute('color', '#101722');

                building.appendChild(rooftop);

                // Determine which face points toward the highway
                const windowX = side === 'right'
                    ? xPosition - width / 2 - 0.08
                    : xPosition + width / 2 + 0.08;

                // Add scattered illuminated windows
                for (
                    let y = baseY + 6;
                    y < baseY + height - 5;
                    y += 7
                ) {

                    for (
                        let z = -depth / 2 + 3;
                        z < depth / 2 - 2;
                        z += 5
                    ) {

                        // Leave some windows dark
                        if (Math.random() > 0.48) continue;

                        const window = document.createElement('a-box');

                        window.setAttribute('width', 0.12);
                        window.setAttribute('height', 1.8);
                        window.setAttribute('depth', 2);

                        window.setAttribute('position', {
                            x: windowX,
                            y: y,
                            z: zPosition + z
                        });

                        const windowColor = windowColors[
                            Math.floor(Math.random() * windowColors.length)
                        ];

                        window.setAttribute('material', {
                            color: windowColor,
                            emissive: windowColor,
                            emissiveIntensity: 0.8
                        });

                        building.appendChild(window);
                    }
                }

                // Add the completed building to the scene
                this.el.appendChild(building);
            }
        }
    });
</script>

<body>
    <a-scene>

        <!-- INVISIBLE LANE DIVIDER TEMPLATE -->
        <a-box
            id="lane-divider-template"
            visible="false"
            width="0.15"
            height="0.03"
            depth="4"
            color="#FFFFFF">
        </a-box>

        <!-- SKY (color="#050817")-->
        <a-sky src="nightsky3.jpg"></a-sky>

        <!-- HIGHWAY PLANE -->
        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="27"
            height="1000"
            color="#202127">
        </a-plane>

        <!-- AWAY HIGHWAY PLANE -->
        <a-plane
            position="-33 0 0"
            rotation="-90 0 0"
            width="27"
            height="1000"
            color="#202127">
        </a-plane>

        <!-- OUTER SHOULDER-->
        <a-plane
            position="18 0 0"
            rotation="-90 0 0"
            width="9"
            height="1000"
            color="#272B30">
        </a-plane>

        <!-- AWAY OUTER SHOULDER -->
        <a-plane
            position="-51 0 0"
            rotation="-90 0 0"
            width="9"
            height="1000"
            color="#272B30">
        </a-plane>
        
        <!-- INNER SHOULDER -->
        <a-plane
            position="-15 0 0"
            rotation="-90 0 0"
            width="3"
            height="1000"
            color="#272B30">
        </a-plane>

        <!-- AWAY INNER SHOULDER -->
        <a-plane
            position="-18 0 0"
            rotation="-90 0 0"
            width="3"
            height="1000"
            color="#272B30">
        </a-plane>

        <!-- MEDIAN THING -->
        <a-box position="-16.5 0 0"
            width="0.4" height="3.5" depth="1000"
            color="#777B82"></a-box>

            <a-box position="-16.5 1.8 0"
                width="0.4" height="0.1" depth="1000"
                color="#ABABB3"></a-box>
        
        <!-- OUTER CONCRETE BARRIERS -->
        <a-box position="21 0 0"
            width="0.7" height = "2.5" depth="1000"
            color="#777B82"></a-box>

        <a-box position="22 0 0"
            width="1.3" height="12" depth="1000"
            color="#666B70"></a-box>

        <a-box position="-54 0 0"
            width="0.7" height = "2.5" depth="1000"
            color="#777B82"></a-box>
        
        <a-box position="-55 0 0"
            width="1.3" height="12" depth="1000"
            color="#666B70"></a-box>

        <!-- LANE DIVIDERS -->
        <a-entity class="lane-dividers">

            <!-- RIGHT HIGHWAY: LEFT LANE DIVIDER -->
            <a-entity
                position="-4.5 0.02 0"
                repeat-object="
                    template: #lane-divider-template;
                    count: 100;
                    spacing: 10;
                    startZ: 500">
            </a-entity>

            <!-- RIGHT HIGHWAY: RIGHT LANE DIVIDER -->
            <a-entity
                position="4.5 0.02 0"
                repeat-object="
                    template: #lane-divider-template;
                    count: 100;
                    spacing: 10;
                    startZ: 500">
            </a-entity>

            <!-- AWAY HIGHWAY: LEFT LANE DIVIDER -->
            <a-entity
                position="-28.5 0.02 0"
                repeat-object="
                    template: #lane-divider-template;
                    count: 100;
                    spacing: 10;
                    startZ: 500">
            </a-entity>

            <!-- AWAY HIGHWAY: RIGHT LANE DIVIDER -->
            <a-entity
                position="-37.5 0.02 0"
                repeat-object="
                    template: #lane-divider-template;
                    count: 100;
                    spacing: 10;
                    startZ: 500">
            </a-entity>

            <!-- SHOULDER DIVIDERS -->
            <a-box position="13.5 0.02 0"
                width="0.15" height="0.03" depth="1000"
                color="#FFFFFF"></a-box>

            <a-box position="-46.5 0.02 0"
                width="0.15" height="0.03" depth="1000"
                color="#FFFFFF"></a-box>

            <!-- CENTER DIVIDERS -->
            <a-box position="-13.5 0.02 0"
                width="0.15" height="0.03" depth="1000"
                color="#FFCC00"></a-box>

            <a-box position="-19.5 0.02 0"
                width="0.15" height="0.03" depth="1000"
                color="#FFCC00"></a-box>

        </a-entity>

        <!-- STREET LIGHTS -->
        <a-entity class="lights">

            <!-- RIGHT-SIDE LIGHT TEMPLATE -->
            <a-entity id="right-light-template" visible="false">
                <a-cylinder position="0 0 0"
                    radius="0.3" height="30"
                    color="#3B3D40"></a-cylinder>

                <a-cylinder position="-2.25 15 0"
                    radius="0.3" height="5"
                    rotation="0 0 90"
                    color="#3B3D40"></a-cylinder>

                <a-cylinder position="-5 15 0"
                    radius="0.7" height="0.3"
                    color="#3B3D40"></a-cylinder>

                <a-sphere position="-5 15 0"
                    radius="0.5"
                    theta-start="80"
                    theta-length="160"
                    color="#F9F871"></a-sphere>
            </a-entity>

            <!-- LEFT / AWAY-SIDE LIGHT TEMPLATE -->
            <a-entity id="away-light-template" visible="false">
                <a-cylinder position="0 0 0"
                    radius="0.3" height="30"
                    color="#3B3D40"></a-cylinder>

                <a-cylinder position="2.25 15 0"
                    radius="0.3" height="5"
                    rotation="0 0 90"
                    color="#3B3D40"></a-cylinder>

                <a-cylinder position="5 15 0"
                    radius="0.7" height="0.3"
                    color="#3B3D40"></a-cylinder>

                <a-sphere position="5 15 0"
                    radius="0.5"
                    theta-start="80"
                    theta-length="160"
                    color="#F9F871"></a-sphere>
            </a-entity>

            <!-- REPEAT RIGHT-SIDE LIGHTS -->
            <a-entity position="21 0 0"
                repeat-object="template: #right-light-template;
                count: 21; spacing: 50; startZ: 500">
            </a-entity>

            <!-- REPEAT LEFT / AWAY-SIDE LIGHTS -->
            <a-entity position="-54 0 0"
                repeat-object="template: #away-light-template;
                count: 21; spacing: 50; startZ: 500">
            </a-entity>

        </a-entity>

        <!-- CITY BUILDINGS: RIGHT SIDE -->
        <a-entity
            city-buildings="side: right; count: 18; spacing: 56; startZ: 470">
        </a-entity>

        <!-- CITY BUILDINGS: LEFT SIDE -->
        <a-entity
            city-buildings="side: left; count: 18; spacing: 56; startZ: 470">
        </a-entity>

            <!-- CAMERA -->
            <a-camera position="0 3 0"></a-camera>

    </a-scene>
</body>
</html>
