    <!-- BOUNDARIES -->
    
<!-- BOUNDARIES -->
    <script>
        AFRAME.registerComponent('highway-boundaries', {
            tick: function () {
                const position = this.el.object3D.position;

                // Highway boundaries
                position.x = THREE.MathUtils.clamp(position.x, -16, 20);
                position.z = THREE.MathUtils.clamp(position.z, -410, 410);

                // Car boundaries
                const cars = [
                    // McLaren
                    { x: 0, z: -35, width: 2.2, length: 4.5 },

                    // Ferrari
                    { x: -9, z: -20, width: 2.5, length: 5 }
                ];

                cars.forEach(car => {
                    const dx = position.x - car.x;
                    const dz = position.z - car.z;

                    if (Math.abs(dx) < car.width &&
                        Math.abs(dz) < car.length) {

                        // Push the camera outside the car's space
                        const overlapX = car.width - Math.abs(dx);
                        const overlapZ = car.length - Math.abs(dz);

                        if (overlapX < overlapZ) {
                            position.x = car.x +
                                (dx >= 0 ? car.width : -car.width);
                        } else {
                            position.z = car.z +
                                (dz >= 0 ? car.length : -car.length);
                        }
                    }
                });
            }
        });
    </script>
</head>

    <!-- REPEAT LIGHTS AND DIVIDERS -->
    <script>
        AFRAME.registerComponent('repeat-object', {

            schema: {
                template: { type: 'selector' },
                count: { type: 'int', default: 10 },
                spacing: { type: 'number', default: 10 },
                startZ: { type: 'number', default: 0 }
            },

            init: function () {

                const template = this.data.template;

                if (!template) {
                    console.error('Repeat-object: Template not found!');
                    return;
                }

                for (let i = 0; i < this.data.count; i++) {

                    // Make a copy of the original object
                    const clone = template.cloneNode(true);

                    // Remove the original ID
                    clone.removeAttribute('id');

                    // Make the copy visible
                    clone.setAttribute('visible', true);

                    // Calculate its new position
                    const zPosition =
                        this.data.startZ - (i * this.data.spacing);

                    clone.setAttribute('position', {
                        x: 0,
                        y: 0,
                        z: zPosition
                    });

                    // Add the copy to the scene
                    this.el.appendChild(clone);
                }
            }
        });

    </script>
