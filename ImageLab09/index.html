<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 0.75 -5" radius="1.25" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 2.25 -5" radius="0.85" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 3.25 -5" radius="0.65" color="#FFFFFF"></a-sphere>
      <a-cone position="0 3.25 -4.2" radius-bottom="0.1" radius-top="0.01" height="0.65" color="orange" rotation="90 0 0"></a-cone>
      <a-sphere position="-0.22 3.55 -4.43" radius="0.09" color="#000000"></a-sphere>
      <a-sphere position="0.22 3.55 -4.43" radius="0.09" color="#000000"></a-sphere>
      <a-cylinder position="-1.0 2.5 -5" radius="0.07" height="1.2" color="#8B4513" rotation="0 0 55"></a-cylinder>
      <a-cylinder position="1.0 2.5 -5" radius="0.07" height="1.2" color="#8B4513" rotation="0 0 -55"></a-cylinder>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4000" height="4000" color="#FAFAFA"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: checkerboard; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
